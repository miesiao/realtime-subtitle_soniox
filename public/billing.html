<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳務與儲值紀錄</title><style>body{max-width:900px;margin:40px auto;padding:0 20px;font:17px/1.7 system-ui}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #ddd}button,input,select{font:inherit;margin:8px}pre{white-space:pre-wrap}a{color:#176c86}</style><body><a href="/sessions">回字幕場次</a><h1>帳務與儲值紀錄</h1><p>目前點數：<strong id="credits">載入中</strong></p><p>人工匯款並回填末五碼後，下一個工作日內核對入帳。逾時請提供訂單編號聯絡 <a data-support href="mailto:hmyculture@gmail.com">hmyculture@gmail.com</a>。</p><p id="status" role="status"></p><h2>儲值</h2><form id="topup"><select id="tier" aria-label="儲值方案"><option value="300">NT$300 / 300 點</option><option value="500">NT$500 / 530 點</option><option value="1000">NT$1,000 / 1,100 點</option></select><button>建立匯款訂單</button></form><pre id="bank"></pre><h2>訂單（最近 100 筆）</h2><div id="orders"></div><h2>點數明細（最近 200 筆）</h2><div id="entries"></div><p>刪除場次仍保留扣點紀錄。需要更早的紀錄請聯絡客服。</p><p><a href="/privacy">資料處理說明</a></p><script type="module" src="/billing.js"></script><script src="/service-info.js"></script></body></html>
