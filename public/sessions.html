<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>字幕場次 — Subtii</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/ds.css" />
<link rel="stylesheet" href="/sessions.css" />
<link rel="stylesheet" href="/site-header.css" />
</head>
<body class="theme-dark">
<header class="site-header">
  <a href="/" class="site-brand brand-lockup" aria-label="Subtii 開字幕首頁"><img src="/logo-black.png" alt="Subtii 開字幕" class="brand-logo-img" width="957" height="160" /></a>
  <nav class="site-header-actions" aria-label="主要導覽">
    <a href="/sessions" class="site-header-secondary">字幕場次</a><a href="/billing" class="site-header-secondary">儲值與帳務</a>
    <a href="/auth/google?returnTo=/sessions" class="site-header-primary" data-header-login>註冊／登入</a><span class="site-account-name" data-header-name data-header-account hidden></span><a href="/auth/logout" data-header-account hidden>登出</a>
  </nav>
</header>

  <main class="sessions-main">
<span id="whoAmI" class="m text-muted" hidden></span>
    <div class="summary-row">
      <div class="card summary-card">
        <div class="m text-muted summary-label">點數餘額</div>
        <div class="summary-amount"><span id="creditsAmount">…</span> <span class="summary-unit">點</span></div>
      </div>
      <button id="newSessionBtn" type="button" class="card summary-cta">
        <div class="summary-cta-title">＋ 開新場次</div>
        <div class="text-muted summary-cta-sub">設語言 → 拿 QR → 開播</div>
      </button>
    </div>

    <section id="tourSection" class="tour-section" hidden>
      <div class="list-toolbar"><h2>旅行團固定入口</h2><span class="text-muted">同一連結可跨天、多場使用</span></div>
      <form id="newTourForm" class="tour-create">
        <label for="tourName">團名</label>
        <input id="tourName" class="input" type="text" maxlength="80" required placeholder="例如：九州五日團" />
        <button type="submit" class="btn btn-primary">建立固定入口</button>
      </form>
      <p id="tourStatus" role="status"></p>
      <div id="tourList" class="tour-list"></div>
    </section>
    <section class="list-section">
      <div class="list-toolbar">
        <span class="m text-muted list-count">場次清單</span>
        <div id="filterChips" class="filter-chips">
          <button type="button" class="filter-chip is-active" data-filter="all">全部</button>
          <button type="button" class="filter-chip" data-filter="live">進行中</button>
          <button type="button" class="filter-chip" data-filter="ended">已結束</button>
        </div>
        <button id="refreshBtn" type="button" class="btn btn-secondary">重新整理</button>
      </div>
      <div id="listBody" class="session-list">
        <div id="listStatus" class="status text-muted">載入中…</div>
      </div>
    </section>
  </main>

  <template id="sessionRowTemplate">
    <div class="session-row">
      <div class="session-row-top">
        <span class="tag statusBadge"></span>
        <span class="tag processingBadge"></span>
        <span class="createdAt m text-muted"></span>
        <a class="btn btn-secondary openBtn" href="#">回到控場</a>
        <button class="btn btn-secondary endBtn" type="button" hidden>結束本場</button>
        <button class="btn btn-secondary deleteBtn" type="button">刪除</button>
      </div>
      <div class="session-row-name">
        <input class="input session-name-input" type="text" placeholder="（未命名）" />
        <button class="btn btn-secondary renameBtn" type="button">改名</button>
        <span class="renameStatus text-muted"></span>
      </div>
      <div class="session-row-transcript" hidden>
        <pre class="transcriptText"></pre>
        <div class="session-row-transcript-actions">
          <button class="btn btn-secondary toggleTranscriptBtn" type="button" hidden>展開</button>
          <button class="btn btn-secondary downloadBtn" type="button" hidden>下載逐字稿 (.txt)</button>
          <button class="btn btn-secondary retryBtn" type="button" hidden>重新整理</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/sessions.js"></script>
  <script type="module" src="/tours.js"></script>
<footer style="padding:24px;text-align:center"><a href="/privacy">資料處理與使用說明</a> · <a href="/billing">帳務與儲值紀錄</a></footer>
<script type="module" src="/site-header.js"></script>
</body>
</html>
