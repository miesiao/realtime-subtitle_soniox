<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="/ds.css" /><title>即時字幕</title>
<link rel="stylesheet" href="/viewer.css" />
<link rel="stylesheet" href="/site-header.css" />
</head>
<body class="theme-dark">
  <div id="connBanner"></div>
  <div id="sessionOverlay" hidden></div>

  <div id="app">
<header class="site-header">
  <a href="/" class="site-brand brand-lockup" aria-label="Subtii 開字幕首頁"><img src="/logo-black.png" alt="Subtii 開字幕" class="brand-logo-img" width="957" height="160" /></a>
  <nav class="site-header-actions" aria-label="主要導覽">
    <a href="/sessions" class="site-header-secondary">字幕場次</a><a href="/billing" class="site-header-secondary">儲值與帳務</a>
    <a href="/auth/google?returnTo=/sessions" class="site-header-primary" data-header-login>註冊／登入</a><span class="site-account-name" data-header-name data-header-account hidden></span><a href="/auth/logout" data-header-account hidden>登出</a>
  </nav>
</header>
    <div id="topBar">
      <span id="connStatus">connecting…</span>
      <label id="toggleOriginal">
        <input type="checkbox" id="showOriginal" checked />
        顯示原文
      </label>
    </div>

    <div id="feedPane">
      <div id="feedInner">
        <div id="loadMoreIndicator"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/viewer.js"></script>
<script type="module" src="/site-header.js"></script>
</body>
</html>
