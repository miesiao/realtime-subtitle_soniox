<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>即時字幕 — Subtii</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/ds.css" />
<link rel="stylesheet" href="/viewer2.css" />
<link rel="stylesheet" href="/site-header.css" />
</head>
<body>
  <div id="connBanner"></div>
  <div id="sessionOverlay" hidden></div>

  <div id="app">
<header class="site-header">
  <a href="/" class="site-brand brand-lockup" aria-label="Subtii 開字幕首頁"><img src="/logo-black.png" alt="Subtii 開字幕" class="brand-logo-img" width="957" height="160" /></a>
  <nav class="site-header-actions" aria-label="主要導覽">
    <a href="/sessions" class="site-header-secondary">字幕場次</a><a href="/billing" class="site-header-secondary">儲值與帳務</a>
    <span class="site-account-name" data-header-name data-header-account hidden></span><a href="/auth/logout" data-header-account hidden>登出</a>
  </nav>
</header>
    <div id="topBar">
      <span id="connStatus">connecting…</span>
      <div id="zoomControl">
        <button id="zoomOutBtn" type="button" aria-label="縮小字級">A−</button>
        <span id="zoomLevel">100%</span>
        <button id="zoomInBtn" type="button" aria-label="放大字級">A+</button>
      </div>
      <label id="toggleOriginal">
        <input type="checkbox" id="showOriginal" checked />
        顯示原文
      </label>
      <button id="themeToggleBtn" type="button" aria-label="切換深色/淺色">☾</button>
    </div>

    <div id="originalPane" class="textPane">
      <div id="originalContent"></div>
    </div>

    <div id="translationPane" class="textPane">
      <div id="translationContent"></div>
    </div>
  </div>

  <script type="module" src="/viewer2.js"></script>
<script type="module" src="/site-header.js"></script>
</body>
</html>
